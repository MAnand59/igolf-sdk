name: Bug report
description: Report reproducible incorrect behavior in igolf-sdk.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include application secrets, signed production URLs, or private customer data.
  - type: input
    id: version
    attributes:
      label: igolf-sdk version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 20.18.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a safe example with all credentials and private data removed.
      render: ts
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs or environment details if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, signed production URLs, and private data.
          required: true
        - label: I searched existing issues for this problem.
          required: true
